<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Debridement CV Trainer (OpenCV.js)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.9);
      --primary: #38bdf8;
      --accent: #f97316;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 0.65rem;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 9999px;
      text-transform: uppercase;
    }

    #fps-meter {
      font-family: monospace;
      font-size: 0.8rem;
      color: #4ade80;
      background: rgba(0, 0, 0, 0.5);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .legend {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-around;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      margin-bottom: 8px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .viewport-container {
      position: relative;
      width: 100%;
      max-width: 520px;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Keep video rendered (not display:none) so mobile browsers never pause frame decoding */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.01;
      pointer-events: none;
    }

    #output-canvas {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .loader-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 20;
      padding: 20px;
      text-align: center;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .mode-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 520px;
      margin: 10px 0;
    }

    .mode-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .controls-card {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .action-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      cursor: pointer;
    }

    #status-bar {
      width: 100%;
      max-width: 520px;
      margin-top: 8px;
      font-family: monospace;
      font-size: 0.7rem;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Debridement CV <span class="badge">3-Zone</span></h1>
    <div id="fps-meter">0 FPS</div>
  </header>

  <div class="legend">
    <div class="legend-item"><span class="dot" style="background:#22c55e;"></span>1. Outer Peel</div>
    <div class="legend-item"><span class="dot" style="background:#38bdf8;"></span>2. White Pith</div>
    <div class="legend-item"><span class="dot" style="background:#f43f5e;"></span>3. Inner Pulp</div>
  </div>

  <div class="viewport-container">
    <div id="loader" class="loader-overlay">
      <div class="spinner"></div>
      <div id="loader-msg" style="font-size: 0.85rem; color: var(--text);">Loading OpenCV.js...</div>
      <button id="manual-start-btn" class="action-btn" style="display:none; max-width:200px; margin-top:8px;" onclick="startCamera(currentFacing)">Tap to Start Camera</button>
    </div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output-canvas"></canvas>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" onclick="setPipelineMode('debridement', this)">3-Zone Mark</button>
    <button class="mode-btn" onclick="setPipelineMode('masks', this)">HSV Masks</button>
    <button class="mode-btn" onclick="setPipelineMode('canny', this)">Canny Edges</button>
    <button class="mode-btn" onclick="setPipelineMode('sobel', this)">Sobel</button>
  </div>

  <div class="controls-card">
    <div class="slider-group">
      <div class="slider-header">
        <span>Orange Saturation Threshold (Peel vs. Pith)</span>
        <span id="sat-val">105</span>
      </div>
      <input type="range" id="sat-thresh" min="40" max="180" value="105" oninput="updateSliders()" />
    </div>

    <div class="slider-group">
      <div class="slider-header">
        <span>Pith Brightness Floor (White Detection)</span>
        <span id="val-val">135</span>
      </div>
      <input type="range" id="val-thresh" min="70" max="220" value="135" oninput="updateSliders()" />
    </div>

    <div class="slider-group">
      <div class="slider-header">
        <span>Canny Edge Sensitivity (Edges Mode)</span>
        <span id="t1-val">60</span>
      </div>
      <input type="range" id="t1" min="10" max="200" value="60" oninput="updateSliders()" />
    </div>

    <div class="action-row">
      <button class="action-btn" onclick="flipCamera()">Switch Camera</button>
      <button class="action-btn" style="background: #334155;" onclick="toggleFreeze()" id="freeze-btn">Freeze</button>
    </div>
  </div>

  <div id="status-bar">Initializing runtime...</div>

  <script>
    let activeMode = 'debridement';
    let currentFacing = 'environment';
    let isFrozen = false;
    let isProcessing = false;
    let cvReady = false;

    // Offscreen canvas for safe cross-browser frame extraction
    const grabCanvas = document.createElement('canvas');
    const grabCtx = grabCanvas.getContext('2d', { willReadFrequently: true });

    // Reusable OpenCV Matrices
    let src, rgb, hsv, blur, gray, dst;
    let orangeMask, pithMask, fruitMask, innerPulpMask, kernel;

    let lastFrameTime = performance.now();
    let frameCounter = 0;

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output-canvas');
    const loader = document.getElementById('loader');
    const loaderMsg = document.getElementById('loader-msg');
    const manualBtn = document.getElementById('manual-start-btn');
    const fpsMeter = document.getElementById('fps-meter');
    const statusBar = document.getElementById('status-bar');

    var Module = {
      onRuntimeInitialized() {
        cvReady = true;
        loaderMsg.textContent = "Requesting camera access...";
        statusBar.textContent = "OpenCV ready. Starting camera...";
        startCamera(currentFacing);
      }
    };

    function updateSliders() {
      document.getElementById('sat-val').textContent = document.getElementById('sat-thresh').value;
      document.getElementById('val-val').textContent = document.getElementById('val-thresh').value;
      document.getElementById('t1-val').textContent = document.getElementById('t1').value;
    }

    function setPipelineMode(mode, btn) {
      activeMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    async function startCamera(facingMode) {
      isProcessing = false;
      manualBtn.style.display = 'none';

      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        loaderMsg.textContent = "Camera API unavailable. Ensure you are using HTTPS.";
        statusBar.textContent = "Error: Requires HTTPS connection.";
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });

        video.srcObject = stream;

        // Wait until video actually has valid non-zero frame dimensions
        await new Promise((resolve) => {
          const checkReady = () => {
            if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0) {
              resolve();
            } else {
              requestAnimationFrame(checkReady);
            }
          };
          video.onloadedmetadata = () => {
            video.play().catch(() => {});
            checkReady();
          };
          checkReady();
        });

        await video.play();

        const w = video.videoWidth;
        const h = video.videoHeight;

        canvas.width = w;
        canvas.height = h;
        grabCanvas.width = w;
        grabCanvas.height = h;

        initOpenCVMats(w, h);

        loader.style.opacity = '0';
        setTimeout(() => { loader.style.display = 'none'; }, 300);
        statusBar.textContent = `Streaming ${w}x${h} (${facingMode})`;

        isProcessing = true;
        requestAnimationFrame(renderLoop);
      } catch (err) {
        console.error(err);
        loaderMsg.textContent = `Camera blocked or failed: ${err.name}`;
        statusBar.textContent = `${err.name}: ${err.message}`;
        manualBtn.style.display = 'inline-block';
      }
    }

    function initOpenCVMats(w, h) {
      [src, rgb, hsv, blur, gray, dst, orangeMask, pithMask, fruitMask, innerPulpMask, kernel].forEach(m => {
        if (m) m.delete();
      });

      src = new cv.Mat(h, w, cv.CV_8UC4);
      rgb = new cv.Mat(h, w, cv.CV_8UC3);
      hsv = new cv.Mat(h, w, cv.CV_8UC3);
      gray = new cv.Mat(h, w, cv.CV_8UC1);
      blur = new cv.Mat(h, w, cv.CV_8UC1);
      dst = new cv.Mat(h, w, cv.CV_8UC1);

      orangeMask = new cv.Mat(h, w, cv.CV_8UC1);
      pithMask = new cv.Mat(h, w, cv.CV_8UC1);
      fruitMask = new cv.Mat(h, w, cv.CV_8UC1);
      innerPulpMask = new cv.Mat(h, w, cv.CV_8UC1);

      kernel = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(5, 5));
    }

    function renderLoop() {
      if (!isProcessing || !cvReady) return;

      if (!isFrozen && video.readyState >= 2) {
        try {
          // Safely extract pixels via 2D context (avoids cv.VideoCapture mobile crashes)
          grabCtx.drawImage(video, 0, 0, grabCanvas.width, grabCanvas.height);
          const imgData = grabCtx.getImageData(0, 0, grabCanvas.width, grabCanvas.height);
          src.data.set(imgData.data);

          const satThresh = parseInt(document.getElementById('sat-thresh').value);
          const valThresh = parseInt(document.getElementById('val-thresh').value);
          const t1 = parseFloat(document.getElementById('t1').value);

          if (activeMode === 'debridement' || activeMode === 'masks') {
            cv.cvtColor(src, rgb, cv.COLOR_RGBA2RGB);
            cv.GaussianBlur(rgb, rgb, new cv.Size(5, 5), 0);
            cv.cvtColor(rgb, hsv, cv.COLOR_RGB2HSV);

            // 1. Orange Color Mask
            let lowOrange = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [4, satThresh, 65, 0]);
            let highOrange = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [26, 255, 255, 255]);
            cv.inRange(hsv, lowOrange, highOrange, orangeMask);
            lowOrange.delete(); highOrange.delete();

            // 2. White Pith Mask
            let lowPith = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [0, 0, valThresh, 0]);
            let highPith = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [180, satThresh, 255, 255]);
            cv.inRange(hsv, lowPith, highPith, pithMask);
            lowPith.delete(); highPith.delete();

            cv.morphologyEx(orangeMask, orangeMask, cv.MORPH_CLOSE, kernel);
            cv.morphologyEx(pithMask, pithMask, cv.MORPH_CLOSE, kernel);

            cv.bitwise_or(orangeMask, pithMask, fruitMask);
            cv.morphologyEx(fruitMask, fruitMask, cv.MORPH_CLOSE, kernel);

            if (activeMode === 'masks') {
              let maskVis = cv.Mat.zeros(src.rows, src.cols, cv.CV_8UC4);
              let greenColor = new cv.Mat(src.rows, src.cols, cv.CV_8UC4, [34, 197, 94, 255]);
              let cyanColor = new cv.Mat(src.rows, src.cols, cv.CV_8UC4, [56, 189, 248, 255]);
              greenColor.copyTo(maskVis, orangeMask);
              cyanColor.copyTo(maskVis, pithMask);
              cv.imshow('output-canvas', maskVis);
              maskVis.delete(); greenColor.delete(); cyanColor.delete();
            } else {
              let contours = new cv.MatVector();
              let hierarchy = new cv.Mat();
              cv.findContours(fruitMask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

              let maxArea = 0;
              let maxIdx = -1;
              for (let i = 0; i < contours.size(); ++i) {
                let area = cv.contourArea(contours.get(i));
                if (area > maxArea && area > 2000) {
                  maxArea = area;
                  maxIdx = i;
                }
              }

              if (maxIdx !== -1) {
                let wholeOrangeSolid = cv.Mat.zeros(src.rows, src.cols, cv.CV_8UC1);
                cv.drawContours(wholeOrangeSolid, contours, maxIdx, new cv.Scalar(255), -1);

                // Region 1: OUTER PEEL (Green)
                cv.drawContours(src, contours, maxIdx, new cv.Scalar(34, 197, 94, 255), 4);

                // Region 2: WHITE PITH inside Peel (Cyan)
                let internalPith = new cv.Mat();
                cv.bitwise_and(pithMask, wholeOrangeSolid, internalPith);

                let pithContours = new cv.MatVector();
                let pithHier = new cv.Mat();
                cv.findContours(internalPith, pithContours, pithHier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let pithSolid = cv.Mat.zeros(src.rows, src.cols, cv.CV_8UC1);
                for (let j = 0; j < pithContours.size(); ++j) {
                  if (cv.contourArea(pithContours.get(j)) > 500) {
                    cv.drawContours(src, pithContours, j, new cv.Scalar(56, 189, 248, 255), 3);
                    cv.drawContours(pithSolid, pithContours, j, new cv.Scalar(255), -1);
                  }
                }

                // Region 3: INNER PULP inside Pith (Coral/Red)
                cv.bitwise_and(orangeMask, pithSolid, innerPulpMask);
                let pulpContours = new cv.MatVector();
                let pulpHier = new cv.Mat();
                cv.findContours(innerPulpMask, pulpContours, pulpHier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                for (let k = 0; k < pulpContours.size(); ++k) {
                  if (cv.contourArea(pulpContours.get(k)) > 250) {
                    cv.drawContours(src, pulpContours, k, new cv.Scalar(244, 63, 94, 255), 3);
                  }
                }

                wholeOrangeSolid.delete();
                internalPith.delete();
                pithContours.delete(); pithHier.delete();
                pithSolid.delete();
                pulpContours.delete(); pulpHier.delete();
              }

              contours.delete();
              hierarchy.delete();
              cv.imshow('output-canvas', src);
            }
          } else {
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);

            if (activeMode === 'canny') {
              cv.Canny(blur, dst, t1, t1 * 2, 3, false);
              cv.imshow('output-canvas', dst);
            } else {
              cv.Sobel(blur, dst, cv.CV_8U, 1, 1, 3, 1, 0, cv.BORDER_DEFAULT);
              cv.imshow('output-canvas', dst);
            }
          }

          frameCounter++;
          const now = performance.now();
          if (now - lastFrameTime >= 1000) {
            fpsMeter.textContent = `${frameCounter} FPS`;
            frameCounter = 0;
            lastFrameTime = now;
          }
        } catch (e) {
          statusBar.textContent = `Loop error: ${e.message || e}`;
          console.error(e);
        }
      }

      requestAnimationFrame(renderLoop);
    }

    function flipCamera() {
      currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
      loader.style.display = 'flex';
      loader.style.opacity = '1';
      loaderMsg.textContent = "Switching camera...";
      startCamera(currentFacing);
    }

    function toggleFreeze() {
      isFrozen = !isFrozen;
      const btn = document.getElementById('freeze-btn');
      btn.textContent = isFrozen ? 'Resume' : 'Freeze';
      btn.style.background = isFrozen ? '#ef4444' : '#334155';
    }
  </script>

  <script async src="https://docs.opencv.org/4.8.0/opencv.js"></script>
</body>
</html>
